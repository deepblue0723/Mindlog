<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e8">
<title>Mindlog</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0e8;color:#262b35;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input{font:inherit}button{border:0}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 18px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.dateBtn{background:none;color:#3A4560;font-weight:700;font-size:17px;padding:8px 0}
.menuBtn{background:#fff;color:#3A4560;width:54px;height:54px;border-radius:17px;font-size:28px;box-shadow:0 3px 14px #0000000d}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #00000009}
.moodVal{text-align:center;font-weight:800;color:#3A4560;font-size:18px;margin-bottom:16px}
.range{width:100%;accent-color:#3A4560}.range::-webkit-slider-thumb{background:#fff;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;border:1px solid #ddd}.range::-moz-range-thumb{background:#fff;width:28px;height:28px;border-radius:50%;border:1px solid #ddd}
.scale{display:flex;justify-content:space-between;font-size:14px;color:#777;margin-top:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f7f5f1;border-radius:15px;padding:12px}
.metric label{display:block;font-size:13px;line-height:1.4;margin-bottom:8px}
.metric input{width:100%;accent-color:#3A4560}
.sleep{display:flex;align-items:center;gap:10px;font-size:18px}
.sleep input{width:100px;padding:10px;border:1px solid #ddd;border-radius:10px}
.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.check{background:#f7f5f1;border-radius:12px;padding:11px 5px;text-align:center;font-size:13px}
.check input{accent-color:#3A4560}
.meds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.med{background:#f7f5f1;border-radius:14px;padding:12px 7px;text-align:center}
.med input{width:100%;margin-top:8px;padding:7px;border:1px solid #ddd;border-radius:8px}
.eventBtn,.save{width:100%;padding:15px;border-radius:15px;font-weight:800}
.eventBtn{background:#fff;color:#3A4560;margin-bottom:10px}
.save{background:#3A4560;color:white}
.overlay{position:fixed;inset:0;background:#0007;backdrop-filter:blur(5px);display:none;z-index:10}
.overlay.on{display:block}
.drawer{position:absolute;right:0;top:0;height:100%;width:68%;max-width:360px;background:#fdfbf7;padding:22px 18px;box-shadow:-8px 0 30px #0002}
.close{float:right;background:none;font-size:30px;color:#3A4560}
.drawer h2{margin:52px 0 20px}.nav{display:block;width:100%;text-align:left;background:none;padding:18px 8px;border-bottom:1px solid #eee;color:#222;font-size:17px}
.page{position:fixed;inset:0;background:#fff;z-index:9;overflow:auto;display:none}.page.on{display:block}
.pageInner{max-width:700px;margin:auto;padding:20px}.back{background:#f5f0e8;border-radius:12px;padding:10px 14px;color:#3A4560}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:18px}
.cal div{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}.head{font-weight:800;background:#fff!important}
.graphBox{background:#faf8f4;border-radius:18px;padding:15px;margin:14px 0}.graphBox canvas{width:100%;height:190px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.on{display:flex}
.modalBox{background:#fff;border-radius:20px;padding:20px;width:min(500px,100%)}textarea{width:100%;min-height:140px;border:1px solid #ddd;border-radius:12px;padding:12px}
.modalActions{display:flex;gap:8px;margin-top:10px}.modalActions button{flex:1;padding:12px;border-radius:12px}.muted{color:#777;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <button class="dateBtn" id="dateBtn"></button>
  <button class="menuBtn" id="menuBtn" aria-label="메뉴">☰</button>
</header>

<section class="card">
  <input id="mood" class="range" type="range" min="-4" max="4" step="1" value="0">
  <div class="scale"><span>-4</span><span>0</span><span>+4</span></div>
</section>

<section class="card"><div class="grid" id="metrics"></div></section>

<section class="card sleep"><b>수면시간</b><input id="sleep" type="number" min="0" max="24" step=".5" placeholder="0">시간</section>

<section class="card"><div class="checks" id="checks"></div></section>
<section class="card"><div class="meds" id="meds"></div></section>

<button class="eventBtn" id="eventBtn">＋ 생활사건</button>
<button class="save" id="save">저장하기</button>
</div>

<div class="overlay" id="overlay">
  <aside class="drawer">
    <button class="close" id="close">×</button>
    <h2>Mindlog</h2>
    <button class="nav" data-page="calendar">달력보기</button>
    <button class="nav" data-page="graph">그래프로보기</button>
    <button class="nav" data-page="clinic">진료</button>
  </aside>
</div>

<div class="page" id="calendar"><div class="pageInner">
  <button class="back" data-closepage>← 돌아가기</button>
  <h2 id="calTitle"></h2><div class="cal" id="cal"></div>
  <p class="muted">날짜를 누르면 해당 기록을 불러옵니다.</p>
</div></div>

<div class="page" id="graph"><div class="pageInner">
  <button class="back" data-closepage>← 돌아가기</button>
  <h2>그래프로 보기</h2>
  <div>시작일 <input id="from" type="date">　종료일 <input id="to" type="date"></div>
  <div class="graphBox"><b>기분</b><canvas id="moodCanvas"></canvas></div>
  <div class="graphBox"><b>불안</b><canvas id="anxCanvas"></canvas></div>
  <div class="graphBox"><b>수면</b><canvas id="sleepCanvas"></canvas></div>
  <div id="medCounts"></div>
</div></div>

<div class="page" id="clinic"><div class="pageInner">
  <button class="back" data-closepage>← 돌아가기</button>
  <h2>진료</h2><p>진료용 요약 화면은 다음 단계에서 만들 수 있어요.</p>
</div></div>

<div class="modal" id="modal"><div class="modalBox">
  <h3>생활사건</h3>
  <textarea id="eventText" placeholder="오늘 있었던 중요한 일이나 상황을 적어주세요."></textarea>
  <div class="modalActions"><button id="cancelEvent">취소</button><button id="saveEvent" style="background:#3A4560;color:#fff">확인</button></div>
</div></div>

<script>
const KEY='mindlog:';

function fmtDate(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return p.year+'-'+p.month+'-'+p.day;
}

let date=fmtDate(new Date());
let eventText='';

const metrics=[
 ['anxiety','두려움 · 소심함 · 걱정 · 불안'],
 ['anger','짜증 · 분노'],
 ['interest','관심 · 흥미 · 즐거움'],
 ['activity','활동량'],
 ['thoughtSpeed','생각의 속도와 양'],
 ['thoughtContent','생각의 내용']
];

const moodColor={
 '-4':'#8ea8d6','-3':'#a7badf','-2':'#bfcee7','-1':'#d9e2f0',
 '0':'#fff','1':'#f4e2de','2':'#edcbc5','3':'#e6b0a8','4':'#d9928a'
};

const $=id=>document.getElementById(id);

function build(){
 $('metrics').innerHTML=metrics.map(([k,l])=>
  '<div class="metric"><label>'+l+'</label><input data-k="'+k+'" type="range" min="-4" max="4" value="0"></div>'
 ).join('');

 $('checks').innerHTML=[
  ['cry','울음'],['binge','폭식'],['period','생리'],['exercise','운동']
 ].map(([k,l])=>
  '<label class="check"><input data-k="'+k+'" type="checkbox"> '+l+'</label>'
 ).join('');

 $('meds').innerHTML=[
  ['morning','아침약'],['evening','저녁약'],['prn','필요시약']
 ].map(([k,l])=>
  '<div class="med">'+l+'<input data-k="'+k+'" type="time"></div>'
 ).join('');
}

function load(){
 const d=JSON.parse(localStorage.getItem(KEY+date)||'{}');
 $('dateBtn').textContent=date.replaceAll('-','.')+' ▾';
 $('mood').value=d.mood??0;

 document.querySelectorAll('[data-k]').forEach(e=>{
   const k=e.dataset.k;
   if(e.type==='checkbox') e.checked=!!d[k];
   else e.value=d[k]??(e.type==='range'?'0':'');
 });
 $('sleep').value=d.sleep??'';
 eventText=d.event??'';
}

$('dateBtn').onclick=()=>{
 const x=document.createElement('input');
 x.type='date'; x.value=date;
 x.style.position='fixed'; x.style.opacity=0;
 document.body.appendChild(x);
 x.onchange=()=>{if(x.value){date=x.value;load()}x.remove()};
 x.onblur=()=>setTimeout(()=>{if(document.body.contains(x))x.remove()},300);
 x.click();
};

$('menuBtn').onclick=()=> $('overlay').classList.add('on');
$('close').onclick=()=> $('overlay').classList.remove('on');

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{
 $('overlay').classList.remove('on'); showPage(b.dataset.page);
});
document.querySelectorAll('[data-closepage]').forEach(b=>b.onclick=()=>b.closest('.page').classList.remove('on'));

function showPage(p){
 $(p).classList.add('on');
 if(p==='calendar')drawCal();
 if(p==='graph')drawGraphs();
}

$('save').onclick=()=>{
 const d={date,mood:+$('mood').value,sleep:+$('sleep').value||0,event:eventText};
 document.querySelectorAll('[data-k]').forEach(e=>{
   d[e.dataset.k]=e.type==='checkbox'?e.checked:e.value;
 });
 localStorage.setItem(KEY+date,JSON.stringify(d));
 alert('저장했어요.');
};

$('eventBtn').onclick=()=>{
 $('eventText').value=eventText;
 $('modal').classList.add('on');
};
$('cancelEvent').onclick=()=> $('modal').classList.remove('on');
$('saveEvent').onclick=()=>{
 eventText=$('eventText').value;
 $('modal').classList.remove('on');
};

function records(){
 const a=[];
 for(let i=0;i<366;i++){
   const d=new Date(date+'T00:00:00');
   d.setDate(d.getDate()-i);
   const s=fmtDate(d);
   const x=JSON.parse(localStorage.getItem(KEY+s)||'null');
   if(x)a.push(x);
 }
 return a;
}

function drawCal(){
 const d=new Date(date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();
 $('calTitle').textContent=y+'년 '+(m+1)+'월';
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h=['일','월','화','수','목','금','토'].map(x=>'<div class="head">'+x+'</div>').join('');
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let n=1;n<=days;n++){
   const s=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
   const x=JSON.parse(localStorage.getItem(KEY+s)||'null');
   h+='<div data-date="'+s+'" style="background:'+(x?moodColor[String(x.mood)]:'#fff')+'">'+n+'</div>';
 }
 $('cal').innerHTML=h;
 $('cal').querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>{
   date=e.dataset.date;load();$('calendar').classList.remove('on');
 });
}

function rangeData(){
 const a=records().sort((x,y)=>x.date.localeCompare(y.date));
 const f=$('from').value,t=$('to').value;
 return a.filter(x=>(!f||x.date>=f)&&(!t||x.date<=t));
}

function line(canvas,key,bar=false){
 const a=rangeData(),ctx=canvas.getContext('2d');
 const w=Math.max(300,canvas.clientWidth)*2,h=190*2;
 canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);
 if(!a.length)return;
 const vals=a.map(x=>+x[key]||0);
 const max=key==='sleep'?Math.max(8,...vals):4,min=key==='sleep'?0:-4;
 ctx.strokeStyle='#3A4560';ctx.fillStyle='#3A4560';ctx.lineWidth=4;
 if(bar){
   const bw=Math.max(5,w/a.length*.55);
   vals.forEach((v,i)=>{
     const xx=(i+.5)/a.length*w,yy=h-(v-min)/(max-min)*h;
     ctx.fillRect(xx-bw/2,yy,bw,h-yy);
   });
 }else{
   ctx.beginPath();
   vals.forEach((v,i)=>{
     const xx=i/(Math.max(1,vals.length-1))*w,yy=h-(v-min)/(max-min)*h;
     i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
   });
   ctx.stroke();
 }
}

function drawGraphs(){
 line($('moodCanvas'),'mood');
 line($('anxCanvas'),'anxiety');
 line($('sleepCanvas'),'sleep',true);
 const a=rangeData();
 $('medCounts').innerHTML=[
   ['morning','아침약'],['evening','저녁약'],['prn','필요시']
 ].map(([k,n])=>'<p>'+n+' '+a.filter(x=>x[k]).length+'회 / 선택기간</p>').join('');
}

$('from').onchange=drawGraphs;
$('to').onchange=drawGraphs;

build();
load();
</script>
</body>
</html>
